name: extraction regression gate

# P4 of #566 (issue #569). Before/after subset-eval gate for any change to the
# extraction/calibration surface. It re-extracts ONLY the "after" side (the
# committed baseline snapshot is the "before"), compares with the same harness
# that caught the #550+#561 regression, and fails the check on a real regression
# (gate.py G1-G7).
#
# OPT-IN (workflow_dispatch or the `run-eval` label). The gate is now trustworthy
# — arXiv infra drops and run-to-run LLM noise no longer false-fail it:
#   - #582: download_pdf retry + cross-run PDF cache (fewer infra drops).
#   - #583: gate.py symmetric-set counting (one-sided infra drops cancel).
#   - #584: N=3 read voting (AAL_READ_SAMPLES=3) damps the run-to-run drift that
#           #580 reintroduced (Opus 4.8 dropped temperature=0); a no-op N=3 pair
#           passes the gate (validated on the union key) while the #550 regression
#           still fails. The committed baseline is itself an N=3 union snapshot, so
#           a dispatched run MUST also use AAL_READ_SAMPLES=3 (set below) to match.
# AUTO-REQUIRED is deliberately NOT enabled: at N=3 the figure key needs ~150 min
# of extraction (56 papers x 3 samples), which OVERRUNS the CI budget — a self-test
# on the figure key was cancelled at the 120-min timeout BEFORE reaching the gate
# step. A per-PR auto-required gate would need a small curated fast subset
# (~12-15 papers) re-pinned at N=3; until then this stays opt-in (dispatch/label).
#
# Additive and independent of the daily/weekly/backfill science pipelines and of
# the no-API eval_tests.yml (this one DOES call the API and is much slower).

on:
  pull_request:
    paths:
      - "pipeline/extractor.py"
      - "pipeline/config.py"
      - "pipeline/transform_guard.py"
      - "pipeline/axis_ocr.py"
      - "pipeline/plot_calibration.py"
      - "pipeline/reviewer.py"
      - "evaluation/subset_eval.py"
      - "evaluation/subset_compare.py"
      - "evaluation/gate.py"
      - "evaluation/eval_runs/baseline/**"
      - ".github/workflows/extraction_regression.yml"
  workflow_dispatch:
    inputs:
      subset_key:
        description: "subset key to gate on (figure | union | zero_overlap | unit_offset)"
        default: "figure"
      soft:
        description: "soft mode (comment only, never fail)"
        type: boolean
        default: false

# Successive pushes to a PR must not stack 40-min API jobs (mirrors backfill.yml).
concurrency:
  group: extraction-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Opt-in: manual dispatch, or add the `run-eval` label to the PR. (Auto-run on
    # every extraction PR is infeasible at N=3 — see header: figure-key extraction
    # overruns the CI timeout.)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'run-eval')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements_pipeline.txt
      - name: Install the tesseract OCR binary
        # Required by pytesseract for the P1 axis-label OCR cross-check. Absent =>
        # axis_ocr degrades to a no-op (pure-LLM axis path), so this only matters
        # for actually exercising the OCR-corroborated override during the eval.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr
      - name: Install pipeline + eval dependencies
        run: |
          pip install -r requirements_pipeline.txt
          pip install scipy   # used by the evaluation metrics

      # Persist the arXiv PDF-metadata cache across runs so we don't re-hammer
      # arXiv (download_pdf has no cross-run cache; this memoizes the metadata).
      - name: Restore extraction cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache
            evaluation/results/metadata_cache.json
          key: extraction-gate-cache-${{ hashFiles('evaluation/subset/subset.json') }}
          restore-keys: |
            extraction-gate-cache-

      - name: Re-extract the AFTER snapshot (figure subset by default, N=3 voted)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # N=3 read voting must match the baseline (also N=3) so a no-op pair
          # stays within the gate's noise floor (#584).
          AAL_READ_SAMPLES: "3"
        run: |
          KEY="${{ github.event.inputs.subset_key || 'figure' }}"
          python -m evaluation.subset_eval extract --key "$KEY" \
            --outdir "$RUNNER_TEMP/after"

      - name: Compare (writes the comparison.md a human reads)
        run: |
          KEY="${{ github.event.inputs.subset_key || 'figure' }}"
          python -m evaluation.subset_compare \
            --before evaluation/eval_runs/baseline \
            --after  "$RUNNER_TEMP/after" \
            --key "$KEY" \
            --out "$RUNNER_TEMP/comparison.md" || true

      - name: Run the regression gate
        id: gate
        env:
          SOFT: ${{ github.event.inputs.soft || 'false' }}
        run: |
          KEY="${{ github.event.inputs.subset_key || 'figure' }}"
          ARGS=""
          if [ "$SOFT" = "true" ]; then ARGS="--soft"; fi
          python -m evaluation.gate \
            --before evaluation/eval_runs/baseline \
            --after  "$RUNNER_TEMP/after" \
            --key "$KEY" \
            --out "$RUNNER_TEMP/gate.md" $ARGS

      - name: Post the report as a sticky PR comment
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: extraction-regression-gate
          path: ${{ runner.temp }}/gate.md
