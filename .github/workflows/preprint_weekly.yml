name: Weekly Preprint Update Checker

on:
  schedule:
    - cron: '0 10 * * 1'  # Monday 10 AM UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (print actions without writing files or opening PRs)'
        required: false
        default: 'false'
      init_only:
        description: 'Init only: populate preprint_versions.json, no PRs'
        required: false
        default: 'false'

# All-Haiku policy (2026-07-03): extraction + reviewer agents run Haiku
# in CI to control cost; unset/override locally for Opus runs.
env:
  EXTRACTOR_MODEL: claude-haiku-4-5-20251001
  REVIEWER_MODEL: claude-haiku-4-5-20251001

jobs:
  preprint-check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements_pipeline.txt

      - name: Configure git identity
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Install LaTeX (needed for matplotlib text rendering in notebooks)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq texlive-latex-extra texlive-fonts-recommended dvipng cm-super

      - name: Install pipeline dependencies
        run: pip install -r requirements_pipeline.txt

      # FIX #547: carry the tracked-versions baseline forward without merging.
      # State PRs are never auto-merged (human-in-the-loop), so master's
      # preprint_versions.json stays frozen and the same preprint version gets
      # re-flagged every run. Before running, restore preprint_versions.json
      # from the open state branch (force-updated each run with the freshest
      # cumulative snapshot) so the checker already knows the versions handled
      # by previous runs. No merge to master needed.
      - name: Restore tracked-versions baseline from state branch
        run: |
          BRANCH="chore/update-preprint-state"
          if git ls-remote --exit-code origin "refs/heads/$BRANCH" >/dev/null 2>&1; then
            git fetch origin "$BRANCH"
            if git cat-file -e "FETCH_HEAD:pipeline/state/preprint_versions.json" 2>/dev/null; then
              git checkout FETCH_HEAD -- pipeline/state/preprint_versions.json
              echo "Restored pipeline/state/preprint_versions.json from origin/$BRANCH"
            else
              echo "Branch $BRANCH has no preprint_versions.json — using master baseline"
            fi
          else
            echo "No state branch $BRANCH yet — using master baseline"
          fi

      # FIX: pass inputs via env vars, never interpolate directly into shell (prevents injection)
      - name: Run preprint update checker
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
          INPUT_INIT_ONLY: ${{ github.event.inputs.init_only }}
        run: |
          ARGS=""
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "$INPUT_INIT_ONLY" = "true" ]; then
            ARGS="$ARGS --init-only"
          fi
          python -m pipeline.preprint_checker $ARGS

      - name: Commit updated state via PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet pipeline/state/preprint_versions.json; then
            echo "No state changes to commit"
          else
            # Single reusable branch (no timestamp): force-update one PR each run
            # so only the latest state snapshot is ever open. State files are
            # cumulative snapshots — only the most recent one is useful — so this
            # avoids the timestamped-PR pile-up. Mirrors backfill.yml's approach.
            BRANCH="chore/update-preprint-state"
            git checkout -B "$BRANCH"
            git add pipeline/state/preprint_versions.json
            git commit -m "chore: update preprint_versions.json state [skip ci]"
            git push -f -u origin "$BRANCH"
            EXISTING=$(gh pr list --repo FaroutYLq/AutoAxionLimits --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
            if [ -z "$EXISTING" ]; then
              gh pr create \
                --title "chore: update preprint_versions.json state" \
                --body "Auto-generated state update from the weekly preprint checker. This PR uses a single reusable branch and is force-updated on every run, so only the latest state snapshot is ever open. Merge it periodically to advance the tracked-versions baseline." \
                --base master \
                --head "$BRANCH" \
                --repo FaroutYLq/AutoAxionLimits
            else
              echo "Reusing existing preprint state PR #$EXISTING (force-updated by this run)"
            fi
          fi

      - name: Upload pipeline logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preprint-logs-${{ github.run_id }}
          path: pipeline/logs/
          if-no-files-found: ignore
          retention-days: 7
