name: Daily arXiv Digest

on:
  schedule:
    - cron: '0 9 * * *'   # 9 AM UTC daily (after arXiv nightly update)
  workflow_dispatch:
    inputs:
      arxiv_id:
        description: 'Force-process a specific arXiv ID (optional)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run (print actions without writing files)'
        required: false
        default: 'false'

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements_pipeline.txt

      - name: Configure git identity
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Install LaTeX (needed for matplotlib text rendering in notebooks)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq texlive-latex-extra texlive-fonts-recommended dvipng cm-super

      - name: Install pipeline dependencies
        run: pip install -r requirements_pipeline.txt

      # FIX #547: carry the processed-papers baseline forward without merging.
      # State PRs are never auto-merged (human-in-the-loop), so master's
      # processed.json stays frozen and the same papers get re-proposed every
      # run until they age out of the arXiv window. Before running, restore
      # processed.json from the open state branch (force-updated each run with
      # the freshest cumulative snapshot) so filter_new_papers() already knows
      # about everything handled by previous runs. No merge to master needed.
      - name: Restore processed-papers baseline from state branch
        run: |
          BRANCH="chore/update-pipeline-state"
          if git ls-remote --exit-code origin "refs/heads/$BRANCH" >/dev/null 2>&1; then
            git fetch origin "$BRANCH"
            if git cat-file -e "FETCH_HEAD:pipeline/state/processed.json" 2>/dev/null; then
              git checkout FETCH_HEAD -- pipeline/state/processed.json
              echo "Restored pipeline/state/processed.json from origin/$BRANCH"
            else
              echo "Branch $BRANCH has no processed.json — using master baseline"
            fi
          else
            echo "No state branch $BRANCH yet — using master baseline"
          fi

      # FIX: pass inputs via env vars, never interpolate directly into shell (prevents injection)
      - name: Run daily arXiv digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_ARXIV_ID: ${{ github.event.inputs.arxiv_id }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          ARGS=""
          if [ -n "$INPUT_ARXIV_ID" ]; then
            ARGS="$ARGS --arxiv-id $INPUT_ARXIV_ID"
          fi
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python -m pipeline.orchestrator $ARGS

      - name: Commit updated state via PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet pipeline/state/; then
            echo "No state changes to commit"
          else
            # Single reusable branch (no timestamp): force-update one PR each run
            # so only the latest state snapshot is ever open. State files are
            # cumulative snapshots — only the most recent one is useful — so this
            # avoids the timestamped-PR pile-up. Mirrors backfill.yml's approach.
            BRANCH="chore/update-pipeline-state"
            git checkout -B "$BRANCH"
            git add pipeline/state/
            git commit -m "chore: update pipeline state [skip ci]"
            git push -f -u origin "$BRANCH"
            EXISTING=$(gh pr list --repo FaroutYLq/AutoAxionLimits --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
            if [ -z "$EXISTING" ]; then
              gh pr create \
                --title "chore: update pipeline state" \
                --body "Auto-generated state update from the daily arXiv digest. This PR uses a single reusable branch and is force-updated on every run, so only the latest state snapshot is ever open. Merge it periodically to advance the processed-papers baseline." \
                --base master \
                --head "$BRANCH" \
                --repo FaroutYLq/AutoAxionLimits
            else
              echo "Reusing existing state PR #$EXISTING (force-updated by this run)"
            fi
          fi

      - name: Upload pipeline logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs-${{ github.run_id }}
          path: pipeline/logs/
          if-no-files-found: ignore
          retention-days: 7
