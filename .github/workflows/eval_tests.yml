name: eval metric tests

# Lightweight unit tests for the evaluation metrics (no Anthropic API calls).
# Additive and independent of the daily/weekly/backfill pipeline workflows.

on:
  push:
    paths:
      - "evaluation/metrics.py"
      - "evaluation/evaluate.py"
      - "evaluation/gate.py"
      - "evaluation/tests/**"
      - "pipeline/transform_guard.py"
      - "pipeline/source_data.py"
      - "evaluation/source_survey.py"
      - "pipeline/vector_trace.py"
      - "evaluation/vector_ceiling.py"
      - "pipeline/vision_gates.py"
      - "evaluation/replay_gates.py"
      - "pipeline/extractor.py"
      - "pipeline/axis_ocr.py"
      - "pipeline/plot_calibration.py"
      - "pipeline/reviewer.py"
      - "pipeline/pr_creator.py"
      - "pipeline/plot_regen.py"
      - "pipeline/tests/**"
      - "pipeline/local_runner.py"
      - "pipeline/run_context.py"
      - "pipeline/monitor.py"
      - "pipeline/orchestrator.py"
      - "pipeline/preprint_checker.py"
      - "pipeline/backfill.py"
      - "pipeline/convention_queue.py"
      - "pipeline/convention_derivation.py"
      - "scripts/run_pipeline.sh"
      - ".claude/skills/**"
      - ".agents/skills/**"
      - ".github/workflows/eval_tests.yml"
  pull_request:
    paths:
      - "evaluation/metrics.py"
      - "evaluation/evaluate.py"
      - "evaluation/gate.py"
      - "evaluation/tests/**"
      - "pipeline/transform_guard.py"
      - "pipeline/source_data.py"
      - "evaluation/source_survey.py"
      - "pipeline/vector_trace.py"
      - "evaluation/vector_ceiling.py"
      - "pipeline/vision_gates.py"
      - "evaluation/replay_gates.py"
      - "pipeline/extractor.py"
      - "pipeline/axis_ocr.py"
      - "pipeline/plot_calibration.py"
      - "pipeline/reviewer.py"
      - "pipeline/pr_creator.py"
      - "pipeline/plot_regen.py"
      - "pipeline/tests/**"
      - "pipeline/local_runner.py"
      - "pipeline/run_context.py"
      - "pipeline/monitor.py"
      - "pipeline/orchestrator.py"
      - "pipeline/preprint_checker.py"
      - "pipeline/backfill.py"
      - "pipeline/convention_queue.py"
      - "pipeline/convention_derivation.py"
      - "scripts/run_pipeline.sh"
      - ".claude/skills/**"
      - ".agents/skills/**"
      - ".github/workflows/eval_tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the tesseract OCR binary + a TrueType font
        # Lets the P1 axis-OCR tests (test_axis_ocr.py / test_plot_calibration.py)
        # run for real in this cheap no-API job. fonts-dejavu-core gives the OCR
        # smoke test a reliable TTF (PIL's default bitmap font OCRs poorly). The
        # tests still self-skip if the binary/font is ever missing, so the job
        # stays green either way.
        run: |
          # The runner image ships third-party apt sources (Google Chrome,
          # Microsoft) that intermittently fail with "Hash Sum mismatch"; they
          # are irrelevant here and must not fail the job. Only the Ubuntu
          # repositories tesseract comes from need to be current.
          sudo grep -rlE "dl\.google\.com|packages\.microsoft\.com" \
              /etc/apt/sources.list /etc/apt/sources.list.d 2>/dev/null \
            | xargs -r sudo rm -f
          # The Ubuntu indices still refresh when a third-party one fails, so a
          # non-zero update must not abort the install that follows.
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq tesseract-ocr fonts-dejavu-core
      - name: Install test dependencies
        # numpy/scipy/pytest for the metric tests; anthropic/arxiv/httpx are
        # import-only deps so the transform_guard extractor-wiring tests (no API
        # calls) can import pipeline.extractor and run here too; opencv/pytesseract
        # for the P1 axis-OCR tests. All such tests self-skip if a dep is ever
        # unavailable, so the job stays green.
        # nbformat is needed by the pipeline reviewer/notebook tests (no API).
        run: pip install numpy scipy pytest anthropic arxiv httpx opencv-python-headless pytesseract pillow matplotlib pymupdf nbformat
      - name: Run metric unit tests
        run: python -m pytest evaluation/tests/ -v
      - name: Run pipeline unit tests (no API — reviewer/pr_creator/plot_regen)
        run: python -m pytest pipeline/tests/ -v
